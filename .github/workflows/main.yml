name: Build HAPKIDO SCORE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Check project files
        run: |
          echo "Checking Android project..."
          ls -la
          echo "Checking Gradle files..."
          find . -maxdepth 3 -name "*.gradle.kts" -o -name "gradlew"

      - name: Upload project files for inspection
        uses: actions/upload-artifact@v4
        with:
          name: HAPKIDO-SCORE-project
          path: |
            *.gradle.kts
            *.properties
            *.xml
            *.kt
            README_FA.md
          if-no-files-found: warn
